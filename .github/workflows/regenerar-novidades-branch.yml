name: Regenerar Novidades no redesign

on:
  push:
    branches: [redesign/painel-contabilista-seguro]

permissions:
  contents: write

jobs:
  gerar:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run novidades:gen
      - name: Versionar apenas os dados derivados
        run: |
          if git diff --quiet -- public/novidades; then
            echo "Nada para atualizar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/novidades
          git commit -m "Atualizar dados derivados de Novidades [skip ci]"
          git push
