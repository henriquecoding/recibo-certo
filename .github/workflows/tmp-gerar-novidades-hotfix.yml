name: Regenerar novidades hotfix

on:
  push:
    branches:
      - hotfix/linkedin-avatar-datepicker-seguranca

permissions:
  contents: write

jobs:
  gerar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/linkedin-avatar-datepicker-seguranca
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run novidades:gen
      - name: Guardar ficheiros derivados
        run: |
          if git diff --quiet -- public/novidades/; then
            echo "Nada a atualizar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/novidades/indice.json public/novidades/meses/
          git commit -m "Gerar dados do popup para 2.51.1"
          git push origin HEAD:hotfix/linkedin-avatar-datepicker-seguranca
