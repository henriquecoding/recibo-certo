name: Testes fiscais e build

# Ponto 9.3 e P3.3 da auditoria ao simulador de recibos de vencimento: as
# tabelas de retenção estavam internamente coerentes e oficialmente
# desatualizadas ao mesmo tempo, e nada corria o conjunto de testes a cada
# alteração. Este workflow é a barreira que faltava — corre em TODOS os pull
# requests e em todos os pushes para `main`, sem filtro de caminhos: uma
# alteração num componente pode partir uma invariante fiscal tão bem como uma
# alteração em `fiscal-data.ts`.
#
# `assertFiscalDataIntegrity()` e `assertChangelogIntegrity()` correm na
# importação dos módulos, pelo que tanto os testes como o build falham se os
# dados fiscais ficarem incoerentes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # RC-CI-005: um push novo cancela o run anterior do mesmo ramo/PR, para a
  # fila nao ficar entupida com resultados que ja nao interessam a ninguem.
  # Em `main` NAO se cancela: cada commit da linha principal tem de ficar com
  # o seu proprio resultado registado.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

          cache: npm
      - run: npm ci

      - name: Tipos (TypeScript strict)
        run: npx tsc --noEmit

      - name: Conjunto de testes
        run: npm test

      - name: Coerência dos dados fiscais nas skills
        run: npm run skills:check

      # Os dados do popup de Novidades são derivados de `src/lib/changelog.ts`
      # por `gen-novidades.mjs`. O `prebuild` regenera-os, por isso o build
      # nunca sai errado — mas a cópia versionada é o que o `next dev` serve, e
      # é essa que esta verificação impede de envelhecer.
      - name: Dados do popup de Novidades em dia
        run: npm run novidades:check

      - name: Build de produção
        run: npm run build

      # Arranca o artefacto dentro do runner. Não cria preview nem deployment:
      # verifica a fronteira HTTP real antes de qualquer merge para produção.
      - name: Smoke do artefacto de produção (sem deploy)
        run: node scripts/smoke-production.mjs

      - name: Auditoria de dependências (0 vulnerabilidades altas)
        run: npm audit --audit-level=high

  # ── O que build, testes e type-check não apanham ────────────────────
  #  `verificar-descobrir-negocio.mjs` foi escrito precisamente para os
  #  defeitos que vivem no ecrã: a leitura NACIONAL filtrada contra `null`
  #  e a desaparecer com a página a dizer «falta sinal na tua zona»; o
  #  preço de UMA unidade escrito no campo do recibo MENSAL. Nenhum dos
  #  dois partia o build, os testes ou o type-check — e o script criado
  #  para os apanhar não corria em CI nenhum, o que protegia exatamente
  #  ninguém.
  #
  #  Sem filtro de caminhos, pela mesma razão que o job acima não o tem:
  #  uma alteração num componente partilhado parte a ferramenta tão bem
  #  como uma alteração dentro dela.
  descoberta-e2e:
    name: Motor de descoberta — fim a fim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      # Arranca em segundo plano e espera pela porta. Sem `wait-on`: um
      # ciclo curto de `curl` evita mais uma dependência só para isto.
      - name: Arrancar o artefacto de produção
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "o servidor não respondeu em 120 s" && exit 1

      - name: Descoberta — 360 px e desktop, claro e escuro, com axe
        run: npm run descobrir:e2e

      - name: Estúdio de empresa — fim a fim
        run: npm run negocio:e2e

  documentos:
    name: Documentos — normas e tipografia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: pip install fonttools brotli pikepdf

      # As fontes preparadas estão versionadas; isto confirma que continuam a
      # bater certo com os estáticos de origem — se um dia o @fontsource mudar
      # as larguras, é aqui que se sabe, e não numa coluna desalinhada.
      - name: Fontes preparadas e tabulares
        run: npm run docs:fontes:check

      # `--pdf-standard a-2a,ua-1` FALHA a compilação num documento inacessível:
      # uma imagem sem descrição ou um título fora da hierarquia ficam vermelhos
      # no PR em vez de saírem num ficheiro que diz «Tagged: yes» e não tem uma
      # única célula de cabeçalho.
      - name: Compor com PDF/A-2a + PDF/UA-1
        run: npm run docs:build

      - name: Fontes embebidas, estrutura, metadados e extração
        run: npm run docs:verify

      # A função da Vercel e o script local partilham `compor()`: se a função
      # deixar de compor, o documento não sai em produção — e é preciso que
      # isso falhe aqui e não lá.
      - name: Compor pela função da Vercel
        env:
          DOCUMENTOS_HMAC_SEGREDO: ci-apenas-para-teste
        run: |
          python3 - <<'EOF'
          import importlib.util, json, hashlib, hmac, os
          spec = importlib.util.spec_from_file_location("compor", "api/compor-documento.py")
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          corpo = json.dumps({"tipo": "vencimento", "dados": {}}, ensure_ascii=False).encode()
          segredo = os.environ["DOCUMENTOS_HMAC_SEGREDO"].encode()
          assert mod._assinatura_valida(corpo, hmac.new(segredo, corpo, hashlib.sha256).hexdigest())
          assert not mod._assinatura_valida(corpo, "0" * 64), "assinatura errada foi aceite"
          dados = json.load(open("src/documentos/dados-exemplo.json", encoding="utf-8"))
          pdf = mod.compor("vencimento", dados)
          open("out/via-funcao.pdf", "wb").write(pdf)
          print(f"função compôs {len(pdf)} bytes")
          EOF
          python3 scripts/verificar-documentos.py out/via-funcao.pdf

      - name: Guardar o documento composto
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentos
          path: out/*.pdf
          retention-days: 14
