name: Testes fiscais e build

# Ponto 9.3 e P3.3 da auditoria ao simulador de recibos de vencimento: as
# tabelas de retenção estavam internamente coerentes e oficialmente
# desatualizadas ao mesmo tempo, e nada corria o conjunto de testes a cada
# alteração. Este workflow é a barreira que faltava — corre em TODOS os pull
# requests e em todos os pushes para `main`, sem filtro de caminhos: uma
# alteração num componente pode partir uma invariante fiscal tão bem como uma
# alteração em `fiscal-data.ts`.
#
# `assertFiscalDataIntegrity()` e `assertChangelogIntegrity()` correm na
# importação dos módulos, pelo que tanto os testes como o build falham se os
# dados fiscais ficarem incoerentes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # RC-CI-005: um push novo cancela o run anterior do mesmo ramo/PR, para a
  # fila nao ficar entupida com resultados que ja nao interessam a ninguem.
  # Em `main` NAO se cancela: cada commit da linha principal tem de ficar com
  # o seu proprio resultado registado.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

          cache: npm
      - run: npm ci

      # Estático e em segundos: um passo do workflow que chama um script
      # inexistente mata o job e apaga tudo o que vinha atrás dele. Vem
      # antes dos tipos de propósito — é a verificação mais barata que há.
      - name: Workflows e package.json de acordo
        run: npm run ci:scripts

      - name: Tipos (TypeScript strict)
        run: npx tsc --noEmit

      - name: Conjunto de testes
        run: npm test

      - name: Motor patronal — casos dourados, paridade entre superfícies e sem hardcodes
        run: npm run motor:check

      - name: Coerência dos dados fiscais nas skills
        run: npm run skills:check

      # O dossiê de um Guia é uma PROJEÇÃO de conteúdo publicado, e é essa a
      # promessa inteira: o que o contabilista lê é o que está no guia, com
      # a fonte ao lado. Uma promessa dessas parte-se em silêncio — basta
      # alguém acrescentar um resumo «para ficar mais legível», ou um campo
      # novo numa secção. Corre-se à parte do conjunto por causa do log: os
      # seis portões dizem qual falhou sem ter de se abrir o relatório.
      - name: Motor de dossiê — projeção, fidelidade, fronteira, áreas e copy
        run: npm run dossie:check

      # Os tipos de aviso vivem em SQL (a restrição de `notificacoes.tipo`) e
      # em TypeScript (a união do catálogo), e nada os obrigava a concordar.
      # Divergiram: quatro tipos que a produção escrevia eram recusados pela
      # tabela — e, porque o aviso nasce na mesma transação que o facto, a
      # recusa desfazia o facto. Nada disto dava erro em lado nenhum.
      - name: Tipos de aviso — SQL, TypeScript e quem os escreve dizem o mesmo
        run: npm run avisos:tipos

      # O conjunto de testes já corre este ficheiro. Corre-se outra vez, com
      # relatório verboso, por uma razão só: PUBLICAR os números no log do CI.
      # Taxa de perfis sem resultado, pool antes da diversificação e domínio
      # da primeira posição não são coisas que se descubram a ler um diff —
      # descobrem-se a vê-las mover-se de PR para PR.
      - name: Cobertura e dominância do motor de descoberta
        run: npm run cobertura:check

      # Os dados do popup de Novidades são derivados de `src/lib/changelog.ts`
      # por `gen-novidades.mjs`. O `prebuild` regenera-os, por isso o build
      # nunca sai errado — mas a cópia versionada é o que o `next dev` serve, e
      # é essa que esta verificação impede de envelhecer.
      - name: Dados do popup de Novidades em dia
        run: npm run novidades:check

      # Cinco portões que existiam, passavam e nunca corriam — o mesmo padrão
      # do P1-11, incluindo um (`nuts:geo:check`) escrito na própria remediação
      # desse P1-11. Escrever o portão e ligá-lo eram dois passos, e o segundo
      # não tinha quem o obrigasse. Agora tem: o `ci:scripts` lê o package.json
      # e reprova qualquer portão que não seja alcançável a partir daqui.
      #
      # Estes quatro são estáticos: comparam o artefacto versionado com o que
      # o gerador produz agora. Segundos, sem rede e sem browser. Um quinto
      # (`concelhos:geo:check`) ficou de fora DESTE passo por desenho: faz
      # 306 pedidos ao Nominatim, um serviço público limitado por taxa que já
      # devolveu 429 a meio de uma corrida local — teria feito o mesmo aqui,
      # numa fila partilhada por todos os runners do GitHub. Está isento no
      # `ci:scripts`, com a razão escrita lá.
      - name: Artefactos gerados em dia — marca, geografia, moldes e quiz
        run: |
          npm run marca:check
          npm run nuts:geo:check
          npm run auth:moldes:check
          npm run quiz:meta:check

      - name: Build de produção
        run: npm run build

      # Arranca o artefacto dentro do runner. Não cria preview nem deployment:
      # verifica a fronteira HTTP real antes de qualquer merge para produção.
      - name: Smoke do artefacto de produção (sem deploy)
        run: node scripts/smoke-production.mjs

      # Estáticos, em segundos, e nunca corriam: o `seo:audit` confere que
      # todas as ferramentas e guias estão no sitemap e que nenhuma página
      # pública herda os metadados da raiz; o `supabase:check` confere que as
      # migrações estão ordenadas e que o ficheiro junto não derivou.
      - name: SEO — sitemap, imagens e metadados próprios
        run: npm run seo:audit

      - name: Supabase — migrações ordenadas e ficheiro junto em dia
        run: npm run supabase:check

      - name: Configuração da Stripe (avisa sem segredos, reprova se estiver errada)
        run: npm run stripe:check

      - name: Auditoria de dependências (0 vulnerabilidades altas)
        run: npm audit --audit-level=high

  homepage-performance:
    name: Homepage · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            cenarios: mobile-fast4g,mobile-slow4g,desktop-normal,desktop-cpu4,desktop-wide,mobile-reduced,desktop-reduced
          - browser: webkit
            cenarios: mobile-fast4g,mobile-reduced
          - browser: firefox
            cenarios: desktop-normal,desktop-reduced
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build

      - name: Arrancar o artefacto de produção
        run: |
          npm start -- --hostname 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "o servidor não respondeu em 120 s" && exit 1

      - name: Medir carga, trocas, FPS e política de prefetch
        env:
          BASE_URL: http://127.0.0.1:3000
          RC_BROWSERS: ${{ matrix.browser }}
          RC_CENARIOS: ${{ matrix.cenarios }}
          RC_REPETICOES: 10
          RC_PERF_OUTPUT: artifacts/desempenho-${{ matrix.browser }}.json
        run: npm run desempenho:ci

      - name: Guardar medições e dispersão
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-performance-${{ matrix.browser }}
          path: artifacts/desempenho-${{ matrix.browser }}.json
          if-no-files-found: warn
          retention-days: 30

  # ── O que build, testes e type-check não apanham ────────────────────
  #  `verificar-descobrir-negocio.mjs` foi escrito precisamente para os
  #  defeitos que vivem no ecrã: a leitura NACIONAL filtrada contra `null`
  #  e a desaparecer com a página a dizer «falta sinal na tua zona»; o
  #  preço de UMA unidade escrito no campo do recibo MENSAL. Nenhum dos
  #  dois partia o build, os testes ou o type-check — e o script criado
  #  para os apanhar não corria em CI nenhum, o que protegia exatamente
  #  ninguém.
  #
  #  Sem filtro de caminhos, pela mesma razão que o job acima não o tem:
  #  uma alteração num componente partilhado parte a ferramenta tão bem
  #  como uma alteração dentro dela.
  descoberta-e2e:
    name: Motor de descoberta — fim a fim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      # Arranca em segundo plano e espera pela porta. Sem `wait-on`: um
      # ciclo curto de `curl` evita mais uma dependência só para isto.
      - name: Arrancar o artefacto de produção
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "o servidor não respondeu em 120 s" && exit 1

      # A pergunta mais barata primeiro: as cinco rotas de foco estão VIVAS?
      # `/inicio/preco` foi a deploy morta — HTTP 200, hidratação a rebentar,
      # rota inteira no `global-error` — e passou por três gates. O smoke de
      # produção lê o status HTTP; a matriz visual corre com movimento
      # REDUZIDO, e o adaptador de movimento sai antes de tocar no WAAPI, pelo
      # que as 20 screenshots nunca correram o caminho partido. Esta etapa
      # corre com movimento LIGADO e é a única que faz essa pergunta.
      - name: Homepage — as cinco rotas hidratam com movimento ligado
        run: BASE_URL=http://localhost:3000 npm run homepage:hidratacao

      - name: Descoberta — 360 px e desktop, claro e escuro, com axe
        run: npm run descobrir:e2e

      - name: Estúdio de empresa — fim a fim
        run: npm run negocio:e2e

      # Mantém o contrato mobile-first da main também sobre a arquitetura
      # otimizada: mede 360 e 320 px, nos dois temas e quatro percursos.
      - name: Telemóvel — 360 e 320 px, dois temas, quatro perfis
        run: npm run movel:e2e

      - name: Planeador patronal — fluxo completo e teste de oclusão nos seis viewports
        run: BASE_URL=http://localhost:3000 npm run contratacao:e2e

      # ┌───────────────────────────────────────────────────────────────┐
      # │ SETE PORTÕES QUE EXISTIAM E NÃO CORRIAM EM LADO NENHUM         │
      # │                                                               │
      # │ Estavam escritos, passavam quando corridos à mão, e nenhum     │
      # │ workflow os chamava. Um deles — a hierarquia visual —          │
      # │ reprovava há semanas sem que ninguém tivesse por onde saber:   │
      # │ mede a separação real de cada superfície nos dois temas, e é   │
      # │ a única coisa que apanha uma borda que não se vê.              │
      # │                                                               │
      # │ Correm todos contra o MESMO artefacto de produção que os de    │
      # │ cima, por isso custam minutos e não uma máquina.               │
      # └───────────────────────────────────────────────────────────────┘
      - name: Hierarquia visual — separação de superfícies nos dois temas
        run: RC_BASE_URL=http://localhost:3000 npm run hierarquia:e2e

      - name: Navegação, cabeçalho e bússola
        run: |
          RC_BASE_URL=http://localhost:3000 npm run navegacao:e2e
          RC_BASE_URL=http://localhost:3000 npm run cabecalho:e2e
          BASE_URL=http://localhost:3000 npm run bussola:e2e

      - name: Painel, visibilidade e palcos
        run: |
          RC_BASE_URL=http://localhost:3000 npm run dashboard:e2e
          RC_BASE_URL=http://localhost:3000 npm run visivel:e2e
          BASE_URL=http://localhost:3000 npm run palcos:e2e

      - name: Simulador de vencimento — controlo a controlo
        run: RC_BASE_URL=http://localhost:3000 npm run vencimento:e2e

      # A zona de risco mexe no `localStorage` de quem carrega no botão, e
      # isso não existe no vitest. O defeito que isto apanha — escolher uma
      # coisa e o cofre inteiro sair atrás — só aparece num browser a sério.
      - name: Zona de risco — apaga só o que foi escolhido, com e sem sessão
        run: RC_BASE_URL=http://localhost:3000 npm run zona:e2e

      # O runner não traz o ImageMagick, e a comparação é feita com `compare
      # -metric AE` — píxeis diferentes, não hashes. Sem ele o passo seguinte
      # morre antes de comparar seja o que for, e foi exatamente isso que
      # aconteceu na primeira corrida em que ele chegou a ser executado: as 20
      # referências foram capturadas e a comparação não chegou a existir.
      - name: ImageMagick para a comparação por píxel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick
          # A política que a distribuição instala limita o cache de píxeis a
          # 256 MiB. Estas capturas de página inteira chegam a 390×17 500, e
          # com esse limite o `compare` passa a trabalhar em disco: minutos
          # por imagem em vez de segundos. Os limites sobem para o que a
          # máquina tem — e o passo tem `timeout-minutes` para nunca mais
          # poder ficar uma hora sem dizer nada.
          POLITICA=$(ls /etc/ImageMagick-*/policy.xml 2>/dev/null | head -1)
          if [ -n "$POLITICA" ]; then
            sudo sed -i \
              -e 's/name="memory" value="[^"]*"/name="memory" value="4GiB"/' \
              -e 's/name="map" value="[^"]*"/name="map" value="8GiB"/' \
              -e 's/name="area" value="[^"]*"/name="area" value="4GP"/' \
              -e 's/name="disk" value="[^"]*"/name="disk" value="16GiB"/' \
              -e 's/name="height" value="[^"]*"/name="height" value="64KP"/' \
              -e 's/name="width" value="[^"]*"/name="width" value="64KP"/' \
              "$POLITICA"
          fi
          identify -list resource

      # As 20 referências são REGENERADAS a cada corrida, a partir de um commit
      # fixo — não são versionadas. Vinte capturas de página inteira pesam
      # ~20 MB; guardá-las no repositório duplicava-o, e cada re-baseline
      # duplicava-o outra vez. O custo é construir a app duas vezes neste job;
      # o proveito é o mesmo: um diff de píxeis contra um estado conhecido.
      #
      # O commit fixo é o que a alteração de tipografia móvel deixou correto
      # (8d81e55). Antes era 233b0a5, de antes dessa alteração: a
      # comparação passou a acusar como regressão a correção do piso de 12px
      # — que é o que acontece a um baseline quando o desenho muda de
      # propósito. Quando voltar a mudar, é este SHA que se atualiza.
      - name: Homepage — referência visual do commit fixado
        timeout-minutes: 25
        run: |
          git fetch --depth=1 origin 8d81e553e03391c50474c7f8af6dbcea7138daa9
          git worktree add --detach /tmp/recibo-homepage-baseline 8d81e553e03391c50474c7f8af6dbcea7138daa9
          cp -al node_modules /tmp/recibo-homepage-baseline/node_modules
          cd /tmp/recibo-homepage-baseline
          npm run build
          npm start -- --hostname 127.0.0.1 --port 3001 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3001/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3001/ >/dev/null
          cd "$GITHUB_WORKSPACE"
          BASE_URL=http://127.0.0.1:3001 npm run homepage:visual:update
          BASE_URL=http://127.0.0.1:3000 npm run homepage:visual

      - name: Guardar matriz visual e diferenças
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-visual-bootstrap
          path: |
            tests/visual/homepage
            artifacts/visual-homepage
          if-no-files-found: warn
          retention-days: 14

  documentos:
    name: Documentos — normas e tipografia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: pip install fonttools brotli pikepdf

      # As fontes preparadas estão versionadas; isto confirma que continuam a
      # bater certo com os estáticos de origem — se um dia o @fontsource mudar
      # as larguras, é aqui que se sabe, e não numa coluna desalinhada.
      - name: Fontes preparadas e tabulares
        run: npm run docs:fontes:check

      # `--pdf-standard a-2a,ua-1` FALHA a compilação num documento inacessível:
      # uma imagem sem descrição ou um título fora da hierarquia ficam vermelhos
      # no PR em vez de saírem num ficheiro que diz «Tagged: yes» e não tem uma
      # única célula de cabeçalho.
      - name: Compor com PDF/A-2a + PDF/UA-1
        run: npm run docs:build

      - name: Fontes embebidas, estrutura, metadados e extração
        run: npm run docs:verify

      # A função da Vercel e o script local partilham `compor()`: se a função
      # deixar de compor, o documento não sai em produção — e é preciso que
      # isso falhe aqui e não lá.
      - name: Compor pela função da Vercel
        env:
          DOCUMENTOS_HMAC_SEGREDO: ci-apenas-para-teste
        run: |
          python3 - <<'EOF'
          import importlib.util, json, hashlib, hmac, os
          spec = importlib.util.spec_from_file_location("compor", "api/compor-documento.py")
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          corpo = json.dumps({"tipo": "vencimento", "dados": {}}, ensure_ascii=False).encode()
          segredo = os.environ["DOCUMENTOS_HMAC_SEGREDO"].encode()
          assert mod._assinatura_valida(corpo, hmac.new(segredo, corpo, hashlib.sha256).hexdigest())
          assert not mod._assinatura_valida(corpo, "0" * 64), "assinatura errada foi aceite"
          dados = json.load(open("src/documentos/dados-exemplo.json", encoding="utf-8"))
          pdf = mod.compor("vencimento", dados)
          open("out/via-funcao.pdf", "wb").write(pdf)
          print(f"função compôs {len(pdf)} bytes")
          EOF
          python3 scripts/verificar-documentos.py out/via-funcao.pdf

      - name: Guardar o documento composto
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentos
          path: out/*.pdf
          retention-days: 14
