name: Proteção de ativos

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: protecao-ativos-${{ github.workflow }}-${{ github.ref }}
  # Como nos restantes workflows: em `main` NÃO se cancela, para cada commit
  # da linha principal ficar com o seu próprio resultado de fronteira
  # registado. Num PR, o push seguinte torna o anterior irrelevante.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fronteira:
    name: Fronteira de segurança e propriedade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4.2.2 fixada ao commit para impedir troca silenciosa
      # da Action por uma tag mutável.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verificar exposição, segredos e fronteiras server-only
        run: node scripts/check-security-boundary.mjs
