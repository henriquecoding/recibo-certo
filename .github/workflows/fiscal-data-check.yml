name: Verificação de dados fiscais

# Monitor mensal dos dados fiscais. Se detetar desatualização, abre uma issue
# para revisão HUMANA. Nunca altera nem aplica dados automaticamente.

on:
  schedule:
    # Dia 1 de cada mês, às 07:00 UTC.
    - cron: "0 7 1 * *"
  workflow_dispatch: {}

concurrency:
  # RC-CI-005: um push novo cancela o run anterior do mesmo ramo/PR, para a
  # fila nao ficar entupida com resultados que ja nao interessam a ninguem.
  # Em `main` NAO se cancela: cada commit da linha principal tem de ficar com
  # o seu proprio resultado registado.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Correr monitor de dados fiscais
        id: check
        run: |
          set +e
          node scripts/check-fiscal-data.mjs --check-sources
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Confirmar que as skills do Claude estão sincronizadas
        run: node scripts/sync-skills-fiscal.mjs --check

      - name: Abrir issue se requer reverificação
        if: steps.check.outputs.exit_code != '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let body = 'O monitor de dados fiscais detetou que os dados precisam de reverificação.';
            try { body = fs.readFileSync('fiscal-check-report.md', 'utf8'); } catch {}

            const title = `Reverificar dados fiscais — ${new Date().toISOString().slice(0,10)}`;

            // Evita duplicar: reutiliza issue aberta com a mesma etiqueta.
            const { data: abertas } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dados-fiscais',
            });

            if (abertas.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: abertas[0].number,
                body: `Nova verificação (${new Date().toISOString().slice(0,10)}):\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['dados-fiscais'],
              });
            }
